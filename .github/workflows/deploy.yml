name: Build and publish Docker image

on:
  push:
    branches: [main]

jobs:
  # Typecheck, lint and unit tests gate the image: a commit that fails any of
  # them never reaches the registry, so the auto-updater never deploys it.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # :latest is what the server's auto-updater follows; the commit tag is a
      # fixed version to roll back to (point the compose file at it).
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cengizozel/oldenbyte:latest
            ghcr.io/cengizozel/oldenbyte:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
